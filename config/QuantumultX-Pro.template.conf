[policy]
# Quantumult X 不支持把一个策略组嵌套进另一个策略组。
# 以下每个业务策略都直接匹配 JMS 节点，避免 malformed policy。

# JMS 线路组
static = LA Direct, resource-tag-regex=^JMS$, server-tag-regex=(?i)c12s[12]\., img-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/United_States.png
static = LA CN2 GIA, resource-tag-regex=^JMS$, server-tag-regex=(?i)c12s3\., img-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/United_States.png
static = Osaka POP, resource-tag-regex=^JMS$, server-tag-regex=(?i)c12s4\., img-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Japan.png
static = Netherlands POP, resource-tag-regex=^JMS$, server-tag-regex=(?i)c12s5\., img-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/EU.png
static = Freedom s801, resource-tag-regex=^JMS$, server-tag-regex=(?i)c12s801\., img-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Download.png
url-latency-benchmark = JMS 优选, resource-tag-regex=^JMS$, server-tag-regex=(?i)c12s[1-5]\., check-interval=600, alive-checking=false, tolerance=50, img-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Auto.png
available = JMS 故障转移, resource-tag-regex=^JMS$, server-tag-regex=(?i)c12s[1-5]\., img-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Available.png

# 业务策略：直接列出 s1-s5，导入后手动选择一次即可
static = PROXY, resource-tag-regex=^JMS$, server-tag-regex=(?i)c12s[1-5]\., img-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Proxy.png
static = AI 服务, resource-tag-regex=^JMS$, server-tag-regex=(?i)c12s[1-5]\., img-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Bot.png
static = 开发服务, resource-tag-regex=^JMS$, server-tag-regex=(?i)c12s[1-5]\., img-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/GitHub.png
static = 下载服务, resource-tag-regex=^JMS$, server-tag-regex=(?i)c12s801\., img-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Download.png
static = TikTok, resource-tag-regex=^JMS$, server-tag-regex=(?i)c12s[1-5]\., img-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/TikTok.png
static = Netflix, resource-tag-regex=^JMS$, server-tag-regex=(?i)c12s[1-5]\., img-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Netflix.png
static = Disney+, resource-tag-regex=^JMS$, server-tag-regex=(?i)c12s[1-5]\., img-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Disney+.png
static = YouTube, resource-tag-regex=^JMS$, server-tag-regex=(?i)c12s[1-5]\., img-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/YouTube.png
static = Spotify, resource-tag-regex=^JMS$, server-tag-regex=(?i)c12s[1-5]\., img-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Spotify.png
static = 社交通信, resource-tag-regex=^JMS$, server-tag-regex=(?i)c12s[1-5]\., img-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Telegram.png
static = 游戏平台, resource-tag-regex=^JMS$, server-tag-regex=(?i)c12s[1-5]\., img-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Game.png

# 直连/拦截策略不与正则节点混写
static = Apple 服务, direct, img-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Apple.png
static = 微软服务, direct, img-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Microsoft.png
static = 广告拦截, reject, direct, img-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/AdBlack.png

