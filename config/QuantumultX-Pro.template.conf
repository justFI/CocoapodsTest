[policy]
# V1.3：恢复图标，并在策略名称中直接标注推荐节点。
# s1/s2=洛杉矶直连，s3=CN2 GIA，s4=大阪 SoftBank，s5=荷兰 POP，s801=省流量下载。

# JMS 线路组
static = LA Direct-s1s2, resource-tag-regex=^JMS$, server-tag-regex=c12s[12], img-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/United_States.png
static = LA CN2 GIA-s3, resource-tag-regex=^JMS$, server-tag-regex=c12s3, img-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/CN2_GIA.png
static = Osaka POP-s4, resource-tag-regex=^JMS$, server-tag-regex=c12s4, img-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/SoftBank.png
static = Netherlands POP-s5, resource-tag-regex=^JMS$, server-tag-regex=c12s5, img-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/EU.png
static = Freedom-s801, resource-tag-regex=^JMS$, server-tag-regex=c12s801, img-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Download.png
url-latency-benchmark = JMS优选-s1到s5, resource-tag-regex=^JMS$, server-tag-regex=c12s[1-5], check-interval=3600, alive-checking=false, tolerance=50, img-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Auto.png
available = JMS故障转移-s1到s5, resource-tag-regex=^JMS$, server-tag-regex=c12s[1-5], img-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Available.png

# 业务策略：名称已标明推荐节点；打开策略后选对应 c12s 节点。
static = 默认代理-推荐s3, resource-tag-regex=^JMS$, server-tag-regex=c12s[1-5], img-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Proxy.png
static = AI服务-推荐s3, resource-tag-regex=^JMS$, server-tag-regex=c12s[1-5], img-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Bot.png
static = 开发服务-推荐s4, resource-tag-regex=^JMS$, server-tag-regex=c12s[1-5], img-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Lab.png
static = 下载服务-固定s801, resource-tag-regex=^JMS$, server-tag-regex=c12s801, img-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Download.png
static = TikTok-推荐s4, resource-tag-regex=^JMS$, server-tag-regex=c12s[1-5], img-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/TikTok.png
static = Netflix-推荐s4, resource-tag-regex=^JMS$, server-tag-regex=c12s[1-5], img-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Netflix.png
static = DisneyPlus-推荐s3, resource-tag-regex=^JMS$, server-tag-regex=c12s[1-5], img-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Streaming.png
static = YouTube-推荐s4, resource-tag-regex=^JMS$, server-tag-regex=c12s[1-5], img-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/YouTube.png
static = Spotify-推荐s4, resource-tag-regex=^JMS$, server-tag-regex=c12s[1-5], img-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Spotify.png
static = 社交通信-推荐s3, resource-tag-regex=^JMS$, server-tag-regex=c12s[1-5], img-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Telegram.png
static = 游戏平台-推荐s1或s2, resource-tag-regex=^JMS$, server-tag-regex=c12s[1-5], img-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Game.png

# 服务商策略：默认直连，也可手动切换稳定节点组；不提供 s801，避免账号/同步/支付链路使用不稳定下载节点。
static = Apple服务-默认直连, direct, LA CN2 GIA-s3, Osaka POP-s4, LA Direct-s1s2, Netherlands POP-s5, JMS优选-s1到s5, JMS故障转移-s1到s5, img-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Apple.png
static = 微软服务-默认直连, direct, Osaka POP-s4, LA CN2 GIA-s3, LA Direct-s1s2, Netherlands POP-s5, JMS优选-s1到s5, JMS故障转移-s1到s5, img-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Microsoft.png

# 广告策略保持 reject/direct，不加入代理节点。
static = 广告拦截-拒绝, reject, direct, img-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/AdBlack.png

